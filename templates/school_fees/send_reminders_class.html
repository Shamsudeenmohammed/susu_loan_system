{% extends 'base.html' %}
{% load core_tags %}

{% block title %}Send Reminders by Class{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <small class="text-muted text-uppercase fw-bold">{{ school_name }}</small>
        <h4 class="mb-0">Send Reminders by Class</h4>
    </div>
    <a href="{% url 'school_fees_send_reminders' %}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Back</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Class/Program</label>
                    <select name="school_class" class="form-select" required>
                        <option value="">Select Class</option>
                        {% for c in school_classes %}
                        <option value="{{ c.pk }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Term (optional)</label>
                    <select name="term" class="form-select">
                        <option value="">All Terms</option>
                        {% for t in terms %}
                        <option value="{{ t.pk }}">{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Reminder Type</label>
                    <select name="reminder_type" class="form-select" required>
                        <option value="">Select Type</option>
                        {% for value, label in reminder_types %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="fas fa-sms me-1"></i>Send Reminders to Class</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
