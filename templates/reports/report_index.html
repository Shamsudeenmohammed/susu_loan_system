{% extends 'base.html' %}

{% block title %}Reports{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="fas fa-chart-bar me-2"></i>Reports</h4>
<div class="row g-3 mb-4">
    <div class="col-6 col-md-4">
        <a href="{% url 'customer_report' %}" class="card quick-action-card text-decoration-none stagger-item">
            <div class="card-body text-center py-4">
                <div class="quick-icon bg-primary bg-opacity-10"><i class="fas fa-users text-primary"></i></div>
                <h6>Customer Report</h6>
            </div>
        </a>
    </div>
    <div class="col-6 col-md-4">
        <a href="{% url 'contributions_report' %}" class="card quick-action-card text-decoration-none stagger-item">
            <div class="card-body text-center py-4">
                <div class="quick-icon bg-success bg-opacity-10"><i class="fas fa-hand-holding-usd text-success"></i></div>
                <h6>Contributions</h6>
            </div>
        </a>
    </div>
    <div class="col-6 col-md-4">
        <a href="{% url 'loan_report' %}" class="card quick-action-card text-decoration-none stagger-item">
            <div class="card-body text-center py-4">
                <div class="quick-icon bg-info bg-opacity-10"><i class="fas fa-file-invoice-dollar text-info"></i></div>
                <h6>Loan Report</h6>
            </div>
        </a>
    </div>
    <div class="col-6 col-md-4">
        <a href="{% url 'repayments_report' %}" class="card quick-action-card text-decoration-none stagger-item">
            <div class="card-body text-center py-4">
                <div class="quick-icon bg-warning bg-opacity-10"><i class="fas fa-money-check-alt text-warning"></i></div>
                <h6>Repayments</h6>
            </div>
        </a>
    </div>
    <div class="col-6 col-md-4">
        <a href="{% url 'overdue_report' %}" class="card quick-action-card text-decoration-none stagger-item">
            <div class="card-body text-center py-4">
                <div class="quick-icon bg-danger bg-opacity-10"><i class="fas fa-exclamation-triangle text-danger"></i></div>
                <h6>Overdue Report</h6>
            </div>
        </a>
    </div>
    <div class="col-6 col-md-4">
        <a href="{% url 'daily_summary' %}" class="card quick-action-card text-decoration-none stagger-item">
            <div class="card-body text-center py-4">
                <div class="quick-icon bg-secondary bg-opacity-10"><i class="fas fa-calendar-day text-secondary"></i></div>
                <h6>Daily Summary</h6>
            </div>
        </a>
    </div>
</div>
<div class="d-flex flex-wrap gap-2">
    <a href="{% url 'export_csv' %}?type=transactions" class="btn btn-outline-success"><i class="fas fa-download me-1"></i>Transactions CSV</a>
    <a href="{% url 'export_csv' %}?type=customers" class="btn btn-outline-success"><i class="fas fa-download me-1"></i>Customers CSV</a>
    <a href="{% url 'export_csv' %}?type=loans" class="btn btn-outline-success"><i class="fas fa-download me-1"></i>Loans CSV</a>
</div>
{% endblock %}
