{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Bad Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0f3460 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        body::before {
            content: ''; position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12;
            width: 400px; height: 400px; background: #f59e0b; top: -100px; right: -80px;
        }
        .error-card {
            text-align: center; background: rgba(255,255,255,0.97);
            border-radius: 16px; box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            padding: 3rem 2.5rem; max-width: 440px; width: 90%;
            position: relative; z-index: 1;
            animation: cardIn 0.6s cubic-bezier(.4,0,.2,1);
        }
        @keyframes cardIn { from { opacity:0; transform:translateY(30px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
        .error-code { font-size: 5rem; font-weight: 700; line-height: 1; margin-bottom: 0.5rem; }
        .error-card h4 { font-weight: 600; margin-bottom: 0.5rem; }
        .error-card p { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .btn-home {
            background: linear-gradient(135deg, #0d6efd, #6366f1); border: none; border-radius: 10px;
            padding: 0.65rem 2rem; font-weight: 600; color: #fff; text-decoration: none;
            transition: all 0.3s; box-shadow: 0 4px 15px rgba(13,110,253,0.3); display: inline-block;
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13,110,253,0.4); color: #fff; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code" style="color: #f59e0b;">400</div>
        <h4>Bad Request</h4>
        <p>The server couldn't understand your request. Please try again or go back to the homepage.</p>
        <a href="/" class="btn-home"><i class="fas fa-home me-2"></i>Go Home</a>
    </div>
</body>
</html>
